<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Israeli Bank Scraper</title>
    <meta name="description" content="Login to your Israeli bank scraper dashboard">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 2px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }

        .auth-tab:hover {
            color: var(--text-secondary);
        }

        .auth-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeInUp 0.3s ease-out;
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-auth:hover:not(:disabled) {
            background: linear-gradient(135deg, #818cf8, #8b5cf6);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="header">
            <span class="logo-icon">🏦</span>
            <h1>Bank Scraper</h1>
            <p>Manage all your Israeli bank accounts in one place</p>
        </div>

        <div class="card">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn-auth" id="btnLogin">Login</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username (3+ chars)" required
                        minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Choose a password (4+ chars)" required
                        minlength="4" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Confirm password" required
                        autocomplete="new-password">
                </div>
                <button type="submit" class="btn-auth" id="btnRegister">Create Account</button>
            </form>

            <div id="status"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
