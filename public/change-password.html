<!DOCTYPE html>
<html lang="he" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent);
        }

        .step-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid var(--border-color);
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .step-dot.done {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .step-connector {
            width: 30px;
            height: 2px;
            background: var(--border-color);
            align-self: center;
        }

        .step-section {
            display: none;
            animation: fadeInUp 0.3s ease-out;
        }

        .step-section.active {
            display: block;
        }

        .otp-input {
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 8px;
            font-weight: 700;
        }

        .sms-info {
            text-align: center;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius-sm);
            color: var(--success);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .form-row-double {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .form-row-double {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <a href="index.html" class="back-link">← Back to Scraper</a>

            <div class="header">
                <h1>🔒 Change Password</h1>
                <p class="subtitle">Isracard / Amex — change your login password</p>
            </div>

            <div class="step-indicator">
                <div class="step-dot active" id="dot1">1</div>
                <div class="step-connector"></div>
                <div class="step-dot" id="dot2">2</div>
                <div class="step-connector"></div>
                <div class="step-dot" id="dot3">3</div>
            </div>

            <!-- STEP 1: ID + Card -->
            <div class="step-section active" id="step1">
                <form id="step1Form">
                    <div class="form-group">
                        <label for="companySelect">Company</label>
                        <select id="companySelect" required>
                            <option value="isracard">Isracard</option>
                            <option value="amex">Amex</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="idNumber">ID Number (ת.ז.)</label>
                        <input type="text" id="idNumber" required placeholder="e.g. 305444580">
                    </div>
                    <div class="form-group">
                        <label for="card6">Last 6 Digits of Card</label>
                        <input type="text" id="card6" required placeholder="e.g. 127037" maxlength="6">
                    </div>
                    <button type="submit" class="btn-primary" id="btnStep1">
                        📱 Send OTP to Phone
                    </button>
                </form>
            </div>

            <!-- STEP 2: Enter OTP -->
            <div class="step-section" id="step2">
                <div class="sms-info" id="smsInfo"></div>
                <form id="step2Form">
                    <div class="form-group">
                        <label for="otpCode">Enter OTP Code</label>
                        <input type="text" id="otpCode" required placeholder="Enter code from SMS" class="otp-input"
                            maxlength="6" autocomplete="one-time-code">
                    </div>
                    <button type="submit" class="btn-primary" id="btnStep2">
                        ✅ Verify Code
                    </button>
                </form>
            </div>

            <!-- STEP 3: New Password -->
            <div class="step-section" id="step3">
                <form id="step3Form">
                    <div class="form-row-double">
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" required placeholder="Enter new password">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" required placeholder="Confirm password">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="btnStep3">
                        🔑 Change Password
                    </button>
                </form>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <script>
        // State carried across steps
        let state = { companyId: '', id: '', card6Digits: '' };

        // Pre-fill company from URL param
        const params = new URLSearchParams(window.location.search);
        if (params.get('company')) {
            document.getElementById('companySelect').value = params.get('company');
        }

        function setStatus(type, message) {
            const el = document.getElementById('status');
            if (!type) { el.innerHTML = ''; return; }
            const icon = type === 'loading' ? '<div class="spinner"></div>' : '';
            el.innerHTML = `<div class="status-message status-${type}">${icon} ${message}</div>`;
        }

        function goToStep(n) {
            document.querySelectorAll('.step-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`dot${i}`);
                dot.classList.remove('active', 'done');
                if (i < n) dot.classList.add('done');
                if (i === n) dot.classList.add('active');
            }
            setStatus(null);
        }

        // Step 1: Send OTP
        document.getElementById('step1Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            state.companyId = document.getElementById('companySelect').value;
            state.id = document.getElementById('idNumber').value;
            state.card6Digits = document.getElementById('card6').value;

            const btn = document.getElementById('btnStep1');
            btn.disabled = true;
            btn.textContent = 'Sending...';
            setStatus('loading', 'Validating and sending OTP...');

            try {
                const res = await fetch('/api/change-password/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('smsInfo').textContent = `📱 Code sent to ${data.smsMasked}`;
                    goToStep(2);
                } else {
                    setStatus('error', data.error);
                }
            } catch (err) {
                setStatus('error', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '📱 Send OTP to Phone';
            }
        });

        // Step 2: Verify OTP
        document.getElementById('step2Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value;

            const btn = document.getElementById('btnStep2');
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            setStatus('loading', 'Verifying OTP...');

            try {
                const res = await fetch('/api/change-password/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...state, otp })
                });
                const data = await res.json();

                if (data.success) {
                    goToStep(3);
                } else {
                    setStatus('error', data.error);
                }
            } catch (err) {
                setStatus('error', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '✅ Verify Code';
            }
        });

        // Step 3: Set new password
        document.getElementById('step3Form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (newPass !== confirm) {
                setStatus('error', 'Passwords do not match');
                return;
            }

            const btn = document.getElementById('btnStep3');
            btn.disabled = true;
            btn.textContent = 'Changing...';
            setStatus('loading', 'Changing password...');

            try {
                const res = await fetch('/api/change-password/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...state, newPassword: newPass })
                });
                const data = await res.json();

                if (data.success) {
                    setStatus('success', '✅ ' + data.message);
                } else {
                    setStatus('error', data.error);
                }
            } catch (err) {
                setStatus('error', err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🔑 Change Password';
            }
        });
    </script>
</body>

</html>
