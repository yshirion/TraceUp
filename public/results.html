<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions — Israeli Bank Scraper</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 30px 20px;
            align-items: stretch;
            max-width: 1300px;
            margin: 0 auto;
        }

        .results-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.4s ease-out;
            flex-wrap: wrap;
            gap: 12px;
        }

        .results-page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .results-page-header .info {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-hover);
            white-space: nowrap;
        }

        .btn-back {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-sm);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-back:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        /* Sort bar */
        .sort-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            animation: fadeInUp 0.35s ease-out;
        }

        .sort-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sort-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sort-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .sort-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .sort-arrow {
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.5s ease-out;
        }

        .table-scroll {
            overflow-x: auto;
            max-height: 75vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 2;
            box-shadow: 0 4px 6px -4px rgba(0, 0, 0, 0.2); /* optional: gives it a little depth */
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-hover);
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.08); /* changed from 0.08 for visibility */
            color: var(--text-primary);
        }

        tr:hover td {
            background: rgba(99, 102, 241, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .amount-positive {
            color: var(--error);
            font-weight: 600;
        }

        .amount-negative {
            color: var(--success);
            font-weight: 600;
        }

        .text-muted {
            color: var(--text-muted);
        }

        .company-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-hover);
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
            }

            .results-page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            th, td {
                padding: 10px 12px;
                font-size: 0.82rem;
            }
        }
    </style>
</head>

<body>

    <div class="results-page-header">
        <div style="display:flex;align-items:center;gap:14px">
            <a href="index.html" class="btn-back">← Dashboard</a>
            <h1>📊 Transactions</h1>
        </div>
        <div class="info">
            <span class="badge" id="countBadge"></span>
        </div>
    </div>

    <div class="results-controls" style="display:flex; flex-direction:column; gap:16px; margin-bottom:20px; background:var(--bg-card); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
        
        <!-- Top Row: Sort Buttons -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; border-bottom:1px solid rgba(99, 102, 241, 0.1); padding-bottom:12px;">
            <div class="sort-bar" style="margin-bottom:0;">
                <span class="sort-label">Sort by:</span>
                <button class="sort-btn active" id="sortDate" onclick="sortBy('date')">
                    Date <span class="sort-arrow" id="arrowDate">▼</span>
                </button>
                <button class="sort-btn" id="sortCompany" onclick="sortBy('company')">
                    Company <span class="sort-arrow" id="arrowCompany">▼</span>
                </button>
                <button class="sort-btn" id="sortAccount" onclick="sortBy('account')">
                    Account <span class="sort-arrow" id="arrowAccount">▼</span>
                </button>
            </div>
            <button class="btn-back" onclick="resetFilters()" style="padding:6px 12px; font-size:0.8rem;">Reset Filters</button>
        </div>

        <!-- Filters Grid -->
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px;" id="filtersGrid">
            
            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">From Date</label>
                <input type="date" id="filterFromDate" onchange="applyFilters()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-family:inherit;">
            </div>

            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Company Type</label>
                <select id="filterCompanyType" onchange="applyFilters()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-family:inherit;">
                    <option value="all">All Types</option>
                    <option value="bank">🏦 Banks Only</option>
                    <option value="creditCard">💳 Credit Cards Only</option>
                </select>
            </div>

            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">
                    Company
                    <span onclick="toggleAllCompanies()" style="float:right; font-weight:400; cursor:pointer; text-transform:none; text-decoration:underline; font-size:0.7rem;">Toggle All</span>
                </label>
                <div id="filterCompanyList" style="max-height:120px; overflow-y:auto; padding:6px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); display:flex; flex-direction:column; gap:4px;">
                    <!-- Populated dynamically by results.js -->
                </div>
            </div>

            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Account</label>
                <select id="filterAccount" onchange="applyFilters()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-family:inherit;">
                    <option value="all">All Accounts</option>
                </select>
            </div>

            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Currency</label>
                <select id="filterCurrency" onchange="applyFilters()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-family:inherit;">
                    <option value="all">All Settings</option>
                    <option value="ils">Local (ILS) Only</option>
                    <option value="foreign">Foreign Currency Only</option>
                </select>
            </div>

            <div class="filter-group" style="display:flex; flex-direction:column; gap:4px;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Installments</label>
                <select id="filterInstallments" onchange="applyFilters()" style="padding:8px 10px; border-radius:6px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-family:inherit;">
                    <option value="all">Include everything</option>
                    <option value="only">Installments Only</option>
                    <option value="none">Hide Installments</option>
                </select>
            </div>

        </div>

        <!-- Amount Range Filter -->
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
            <div style="display:flex; justify-content:space-between;">
                <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Amount Range (ILS)</label>
                <span id="amountDisplay" style="font-size:0.8rem; color:var(--accent);">0 to 0</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <input type="number" id="amountMinRaw" onchange="syncAmountInputs(true)" style="width:80px; padding:6px; border-radius:4px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-size:0.8rem;" placeholder="Min">
                
                <div style="position:relative; flex-grow:1; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin:10px 0;">
                    <input type="range" id="amountMin" oninput="syncAmountInputs(false)" style="position:absolute; width:100%; top:-8px; pointer-events:none; -webkit-appearance:none; background:transparent;">
                    <input type="range" id="amountMax" oninput="syncAmountInputs(false)" style="position:absolute; width:100%; top:-8px; pointer-events:none; -webkit-appearance:none; background:transparent;">
                </div>

                <input type="number" id="amountMaxRaw" onchange="syncAmountInputs(true)" style="width:80px; padding:6px; border-radius:4px; border:1px solid var(--border-color); background:rgba(0,0,0,0.2); color:var(--text-primary); font-size:0.8rem;" placeholder="Max">
            </div>
            <style>
                input[type=range]::-webkit-slider-thumb {
                    pointer-events:all; width:16px; height:16px; -webkit-appearance:none; border-radius:50%; background:var(--accent); cursor:pointer;
                }
            </style>
        </div>

    </div>

    <div class="table-container">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Company</th>
                        <th>Account</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Original Amount</th>
                        <th>Memo</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="results.js"></script>
    <script src="inactivity.js"></script>
</body>

</html>
